name: Account Isolation Validation

on:
  push:
    branches:
      - fix/account-isolation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Targeted account isolation tests
        run: npx vitest run src/lib/workspaceSession.test.ts

      - name: Full test suite
        run: npm test

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build
